<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>פעילות בחירות ודמוקרטיה</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#1f2937;display:grid;place-items:center;min-height:100vh}
    main{width:min(900px,92vw);background:#fff;border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.08);text-align:center}
    h1{font-size:clamp(2rem,5vw,4rem);margin:.2em 0}
    p{font-size:1.25rem;line-height:1.7}
    .tag{display:inline-block;padding:.45rem .85rem;border-radius:999px;background:#eef2ff;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="tag">Student Lab</div>
    <h1>בחירות ודמוקרטיה</h1>
    <p>עמוד ניסיוני לפעילות הכיתתית בנושא בחירה הוגנת, קולות שונים והצבעה.</p>
    <p>כאן נבנה את הפעילות האינטראקטיבית לתלמידים.</p>
  </main>
</body>
</html>
