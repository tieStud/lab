<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#fbfaf7">
  <title>פעילות בחירות ודמוקרטיה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@400;500;700&display=swap">
  <style>
    :root{
      --paper:#fbfaf7;--paper2:#f4f1ea;--card:#ffffff;--line:#e7e3dc;--ink:#1f2a37;--muted:#5b6574;--dim:#8a93a1;
      --teal:#0f766e;--teal-soft:#e3f1ee;--orange:#f4a259;--violet:#8c7ae6;--rose:#e76f86;--sky:#4c8bd6;
      --display:"Rubik",Arial,sans-serif;--body:"Heebo",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;padding:20px 24px 28px;overflow-x:hidden;position:relative}
    .bg{position:absolute;inset:0 0 auto 0;height:560px;overflow:hidden;pointer-events:none;z-index:0}
    .bg i{position:absolute;top:-240px;left:-200px;width:600px;height:600px;border-radius:50%;background:#e6f4f1}
    .topbar{position:relative;z-index:1;width:min(1040px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px}
    .brand small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:14px}
    .mark{width:36px;height:36px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
    .back{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;box-shadow:0 6px 18px rgba(31,42,55,.06)}
    .back:hover{border-color:var(--teal);color:var(--teal)}
    main{position:relative;z-index:1;flex:1;display:flex;align-items:center;width:min(760px,100%);padding:32px 0}
    .panel{position:relative;width:100%;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:48px 40px 40px;box-shadow:0 18px 50px rgba(31,42,55,.08);text-align:center;overflow:hidden}
    .panel::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--teal) 0 20%,var(--orange) 20% 40%,var(--violet) 40% 60%,var(--rose) 60% 80%,var(--sky) 80%)}
    .ico{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--teal-soft);display:grid;place-items:center;font-size:44px;line-height:1}
    .tag{display:inline-block;padding:6px 13px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:14px}
    h1{margin:14px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,54px);line-height:1.08;letter-spacing:-.4px}
    p{margin:10px auto 0;max-width:540px;color:var(--muted);font-size:19px;line-height:1.65}
    .soon{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:10px 18px;border-radius:999px;background:var(--paper2);color:var(--ink);font-weight:700;font-size:15px}
    .soon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
    @media (max-width:560px){
      body{padding:16px 16px 22px}
      .brand small{display:none}
      main{align-items:flex-start;padding-top:24px}
      .panel{padding:36px 20px 28px;border-radius:22px}
      .ico{width:70px;height:70px;font-size:36px;border-radius:20px}
      p{font-size:17px}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i></div>
  <header class="topbar">
    <div class="brand"><span class="mark">TIE</span>Tech It Easy <small>· מעבדת תלמידים</small></div>
    <a class="back" href="../">← הזנת קוד</a>
  </header>
  <main>
    <section class="panel">
      <div class="ico" aria-hidden="true">🗳️</div>
      <div class="tag">Student Lab</div>
      <h1>בחירות ודמוקרטיה</h1>
      <p>עמוד ניסיוני לפעילות הכיתתית בנושא בחירה הוגנת, קולות שונים והצבעה.</p>
      <p>כאן נבנה את הפעילות האינטראקטיבית לתלמידים.</p>
      <div class="soon">בקרוב</div>
    </section>
  </main>
</body>
</html>
