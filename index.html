<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>Tech It Easy — מעבדת תלמידים</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#07101f;
      --panel:#0d1930;
      --panel-2:#10213f;
      --line:#2e4d78;
      --accent:#31e8ff;
      --text:#fff;
      --muted:#b9c8df;
      --danger:#ff6b81;
    }
    html,body{min-height:100%}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% 0%,rgba(49,232,255,.09),transparent 34%),
        var(--bg);
      color:var(--text);
      display:grid;
      place-items:center;
      padding:24px;
    }
    .wrap{
      width:min(560px,100%);
      text-align:center;
    }
    .badge{
      display:inline-block;
      margin-bottom:14px;
      padding:7px 13px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--accent);
      font-weight:700;
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(34px,8vw,56px);
      line-height:1.05;
    }
    .lead{
      margin:0 auto 28px;
      max-width:460px;
      color:var(--muted);
      font-size:18px;
      line-height:1.55;
    }
    .card{
      border:1px solid var(--line);
      border-radius:26px;
      background:rgba(13,25,48,.94);
      box-shadow:0 22px 70px rgba(0,0,0,.32);
      padding:28px;
    }
    .label{
      display:block;
      margin-bottom:14px;
      color:#dce8f8;
      font-size:16px;
      font-weight:700;
    }
    .code-display{
      direction:ltr;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:18px;
    }
    .digit{
      min-height:66px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:17px;
      background:#081426;
      font-size:34px;
      font-weight:800;
      color:var(--text);
      transition:.18s ease;
    }
    .digit.filled{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(49,232,255,.08);
    }
    .hidden-code-input{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:1px;
      height:1px;
    }
    .numpad{
      direction:ltr;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:11px;
      margin-top:10px;
    }
    button{
      appearance:none;
      border:1px solid var(--line);
      border-radius:17px;
      min-height:62px;
      background:var(--panel-2);
      color:var(--text);
      font:inherit;
      font-size:24px;
      font-weight:800;
      cursor:pointer;
      transition:.16s ease;
      touch-action:manipulation;
    }
    button:hover,
    button:focus-visible{
      transform:translateY(-2px);
      border-color:var(--accent);
      outline:none;
      box-shadow:0 8px 24px rgba(49,232,255,.12);
    }
    button:active{transform:translateY(0) scale(.98)}
    .clear{
      font-size:18px;
      color:#d6e4f6;
    }
    .enter{
      font-size:18px;
      color:#001319;
      background:var(--accent);
      border-color:var(--accent);
    }
    .status{
      min-height:24px;
      margin-top:16px;
      color:var(--muted);
      font-size:15px;
      font-weight:700;
    }
    .status.error{color:var(--danger)}
    .hint{
      margin-top:20px;
      color:#8397b6;
      font-size:13px;
      line-height:1.5;
    }
    @media (max-width:520px){
      body{padding:18px}
      .card{padding:22px 18px}
      .digit{min-height:58px;font-size:30px}
      button{min-height:58px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">Tech It Easy</div>
    <h1>ברוכים הבאים למעבדה</h1>
    <p class="lead">הקלידו את הקוד בן 4 הספרות שקיבלתם מהמדריך כדי להיכנס לפעילות.</p>

    <section class="card" aria-labelledby="code-label">
      <span class="label" id="code-label">קוד פעילות</span>

      <input
        id="codeInput"
        class="hidden-code-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="קוד פעילות בן ארבע ספרות"
      >

      <div class="code-display" id="codeDisplay" aria-hidden="true">
        <div class="digit"></div>
        <div class="digit"></div>
        <div class="digit"></div>
        <div class="digit"></div>
      </div>

      <div class="numpad" aria-label="לוח מספרים">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="clear" id="clearBtn">מחיקה</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="enter" id="enterBtn">כניסה</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="hint">אפשר להקליד גם ישירות מהמקלדת.</div>
    </section>
  </main>

  <script>
    // Hidden static activity map. Add new student activity codes here.
    const ACTIVITY_ROUTES = Object.freeze({
      "1111": "./picTpic/"
    });

    const input = document.getElementById("codeInput");
    const digits = [...document.querySelectorAll(".digit")];
    const status = document.getElementById("status");

    function setCode(value){
      input.value = String(value).replace(/\D/g,"").slice(0,4);
      renderCode();
    }

    function renderCode(){
      digits.forEach((el,index)=>{
        const value = input.value[index] || "";
        el.textContent = value;
        el.classList.toggle("filled", Boolean(value));
      });
      status.textContent = "";
      status.className = "status";
    }

    function addDigit(digit){
      if(input.value.length >= 4) return;
      setCode(input.value + digit);
      if(input.value.length === 4) submitCode();
    }

    function clearCode(){
      setCode(input.value.slice(0,-1));
    }

    function submitCode(){
      const code = input.value;
      if(code.length !== 4){
        status.textContent = "יש להזין 4 ספרות.";
        status.className = "status error";
        return;
      }

      const target = ACTIVITY_ROUTES[code];
      if(!target){
        status.textContent = "הקוד לא נמצא. בדקו עם המדריך ונסו שוב.";
        status.className = "status error";
        setCode("");
        return;
      }

      status.textContent = "מעבירים אתכם לפעילות…";
      window.location.assign(target);
    }

    document.querySelectorAll("[data-digit]").forEach(button=>{
      button.addEventListener("click",()=>addDigit(button.dataset.digit));
    });

    document.getElementById("clearBtn").addEventListener("click",clearCode);
    document.getElementById("enterBtn").addEventListener("click",submitCode);

    document.addEventListener("keydown",(event)=>{
      if(/^\d$/.test(event.key)){
        event.preventDefault();
        addDigit(event.key);
      }else if(event.key === "Backspace" || event.key === "Delete"){
        event.preventDefault();
        clearCode();
      }else if(event.key === "Enter"){
        event.preventDefault();
        submitCode();
      }else if(event.key === "Escape"){
        event.preventDefault();
        setCode("");
      }
    });

    // Keep native autofill/history prompts out of the student flow.
    input.setAttribute("name","activity_code_" + Math.random().toString(36).slice(2));
    input.setAttribute("readonly","");
    input.addEventListener("focus",()=>input.removeAttribute("readonly"));

    renderCode();
  </script>
</body>
</html>
