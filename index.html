<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>Tech It Easy — מעבדת תלמידים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@400;500;700&display=swap">
  <style>
    *{box-sizing:border-box}
    :root{
      --paper:#fbfaf7;
      --paper2:#f4f1ea;
      --card:#ffffff;
      --line:#e7e3dc;
      --ink:#1f2a37;
      --muted:#5b6574;
      --dim:#8a93a1;
      --teal:#0f766e;
      --teal-soft:#e3f1ee;
      --bad:#c2410c;
      --bad-bg:#fdebe3;
      --display:"Rubik",Arial,sans-serif;
      --body:"Heebo",Arial,sans-serif;
    }
    html,body{min-height:100%}
    body{
      margin:0;
      min-height:100vh;
      font-family:var(--body);
      background:var(--paper);
      color:var(--ink);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px 24px 28px;
      overflow-x:hidden;
      position:relative;
    }
    .bg{position:absolute;inset:0 0 auto 0;height:560px;overflow:hidden;pointer-events:none;z-index:0}
    .bg i{position:absolute;top:-240px;left:-200px;width:600px;height:600px;border-radius:50%;background:#e6f4f1}
    .topbar{
      position:relative;z-index:1;
      width:min(1040px,100%);
      display:flex;align-items:center;gap:10px;
      font-family:var(--display);font-weight:700;font-size:16px;
    }
    .mark{width:36px;height:36px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
    .topbar small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:14px}
    .wrap{
      position:relative;z-index:1;
      flex:1;
      width:min(480px,100%);
      display:flex;flex-direction:column;justify-content:center;
      text-align:center;
      padding:18px 0 4px;
    }
    .hello{
      width:64px;height:64px;margin:0 auto 14px;
      border-radius:22px;background:var(--card);border:1px solid var(--line);
      box-shadow:0 6px 18px rgba(31,42,55,.06);
      display:grid;place-items:center;font-size:34px;line-height:1;
    }
    .badge{
      display:inline-block;
      align-self:center;
      margin-bottom:12px;
      padding:6px 13px;
      border-radius:999px;
      background:var(--teal-soft);
      color:var(--teal);
      font-weight:700;
      font-size:14px;
    }
    h1{
      margin:0 0 10px;
      font-family:var(--display);
      font-weight:800;
      font-size:clamp(32px,7vw,46px);
      line-height:1.08;
      letter-spacing:-.4px;
    }
    .lead{
      margin:0 auto 22px;
      max-width:400px;
      color:var(--muted);
      font-size:18px;
      line-height:1.55;
    }
    .card{
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--card);
      box-shadow:0 18px 50px rgba(31,42,55,.08);
      padding:22px 24px 18px;
    }
    .label{
      display:block;
      margin-bottom:14px;
      color:var(--muted);
      font-size:15px;
      font-weight:700;
    }
    .code-display{
      direction:ltr;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:16px;
    }
    .digit{
      min-height:68px;
      display:grid;
      place-items:center;
      border:1.5px solid var(--line);
      border-radius:18px;
      background:var(--paper);
      font-family:var(--display);
      font-size:36px;
      font-weight:800;
      color:var(--ink);
      transition:.18s ease;
    }
    .digit.filled{
      border-color:var(--teal);
      background:var(--card);
      color:var(--teal);
      box-shadow:0 0 0 4px rgba(15,118,110,.12);
    }
    .hidden-code-input{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:1px;
      height:1px;
    }
    .numpad{
      direction:ltr;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:6px;
    }
    button{
      appearance:none;
      border:1px solid var(--line);
      border-bottom-width:3px;
      border-radius:16px;
      min-height:58px;
      background:var(--card);
      color:var(--ink);
      font-family:var(--display);
      font-size:25px;
      font-weight:700;
      cursor:pointer;
      transition:.14s ease;
      touch-action:manipulation;
    }
    button:hover,
    button:focus-visible{
      transform:translateY(-1px);
      border-color:#cfc8bd;
      background:#fffdf9;
      outline:none;
      box-shadow:0 6px 16px rgba(31,42,55,.08);
    }
    button:focus-visible{box-shadow:0 0 0 4px rgba(15,118,110,.18)}
    button:active{transform:translateY(1px);box-shadow:none}
    .clear{
      font-family:var(--body);
      font-size:17px;
      color:var(--muted);
      background:var(--paper2);
    }
    .clear:hover,.clear:focus-visible{background:#eee9df}
    .enter{
      font-family:var(--body);
      font-size:18px;
      color:#fff;
      background:var(--teal);
      border-color:#0b5d57;
    }
    .enter:hover,.enter:focus-visible{background:#0d6b64;border-color:#0b5d57}
    .status{
      min-height:24px;
      margin-top:16px;
      color:var(--teal);
      font-size:15px;
      font-weight:700;
    }
    .status.error{
      display:inline-block;
      padding:6px 14px;
      border-radius:999px;
      background:var(--bad-bg);
      color:var(--bad);
    }
    .status:empty{padding:0}
    .hint{
      margin-top:14px;
      color:var(--dim);
      font-size:13.5px;
      line-height:1.5;
    }
    .foot{position:relative;z-index:1;margin-top:16px;color:var(--dim);font-size:13px}
    @media (max-width:520px){
      body{padding:16px 16px 22px}
      .wrap{justify-content:flex-start;padding-top:20px}
      .hello{width:64px;height:64px;font-size:34px;border-radius:19px;margin-bottom:14px}
      .lead{font-size:16.5px;margin-bottom:20px}
      .card{padding:20px 16px 18px;border-radius:22px}
      .code-display{gap:10px}
      .digit{min-height:62px;font-size:31px;border-radius:15px}
      button{min-height:60px}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i></div>
  <header class="topbar"><span class="mark">TIE</span>Tech It Easy <small>· מעבדת תלמידים</small></header>
  <main class="wrap">
    <div class="hello" aria-hidden="true">🧪</div>
    <div class="badge">מעבדת התלמידים</div>
    <h1>ברוכים הבאים למעבדה</h1>
    <p class="lead">הקלידו את הקוד בן 4 הספרות שקיבלתם מהמדריך כדי להיכנס לפעילות.</p>

    <section class="card" aria-labelledby="code-label">
      <span class="label" id="code-label">קוד פעילות</span>

      <input
        id="codeInput"
        class="hidden-code-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="קוד פעילות בן ארבע ספרות"
      >

      <div class="code-display" id="codeDisplay" aria-hidden="true">
        <div class="digit"></div>
        <div class="digit"></div>
        <div class="digit"></div>
        <div class="digit"></div>
      </div>

      <div class="numpad" aria-label="לוח מספרים">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="clear" id="clearBtn">מחיקה</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="enter" id="enterBtn">כניסה</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="hint">אפשר להקליד גם ישירות מהמקלדת.</div>
    </section>
  </main>
  <div class="foot">Tech It Easy</div>

  <script>
    // Hidden static activity map. Add new student activity codes here.
    const ACTIVITY_ROUTES = Object.freeze({
      "1111": "./picTpic/"
    });

    const input = document.getElementById("codeInput");
    const digits = [...document.querySelectorAll(".digit")];
    const status = document.getElementById("status");

    function setCode(value){
      input.value = String(value).replace(/\D/g,"").slice(0,4);
      renderCode();
    }

    function renderCode(){
      digits.forEach((el,index)=>{
        const value = input.value[index] || "";
        el.textContent = value;
        el.classList.toggle("filled", Boolean(value));
      });
      status.textContent = "";
      status.className = "status";
    }

    function addDigit(digit){
      if(input.value.length >= 4) return;
      setCode(input.value + digit);
      if(input.value.length === 4) submitCode();
    }

    function clearCode(){
      setCode(input.value.slice(0,-1));
    }

    function submitCode(){
      const code = input.value;
      if(code.length !== 4){
        status.textContent = "יש להזין 4 ספרות.";
        status.className = "status error";
        return;
      }

      const target = ACTIVITY_ROUTES[code];
      if(!target){
        setCode("");
        status.textContent = "הקוד לא נמצא. בדקו עם המדריך ונסו שוב.";
        status.className = "status error";
        return;
      }

      status.textContent = "מעבירים אתכם לפעילות…";
      window.location.assign(target);
    }

    document.querySelectorAll("[data-digit]").forEach(button=>{
      button.addEventListener("click",()=>addDigit(button.dataset.digit));
    });

    document.getElementById("clearBtn").addEventListener("click",clearCode);
    document.getElementById("enterBtn").addEventListener("click",submitCode);

    document.addEventListener("keydown",(event)=>{
      if(/^\d$/.test(event.key)){
        event.preventDefault();
        addDigit(event.key);
      }else if(event.key === "Backspace" || event.key === "Delete"){
        event.preventDefault();
        clearCode();
      }else if(event.key === "Enter"){
        event.preventDefault();
        submitCode();
      }else if(event.key === "Escape"){
        event.preventDefault();
        setCode("");
      }
    });

    // Keep native autofill/history prompts out of the student flow.
    input.setAttribute("name","activity_code_" + Math.random().toString(36).slice(2));
    input.setAttribute("readonly","");
    input.addEventListener("focus",()=>input.removeAttribute("readonly"));

    renderCode();
  </script>
</body>
</html>
